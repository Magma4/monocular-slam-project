%YAML:1.0

# ORB-SLAM3 monocular settings for custom 1280x720 video frames.
# This is a practical smoke-test config, not a calibrated camera model.
# For best results, replace fx/fy/cx/cy and distortion with real calibration values.

Camera.type: "PinHole"

# Approximate pinhole intrinsics for 1280x720 video.
Camera.fx: 720.0
Camera.fy: 720.0
Camera.cx: 640.0
Camera.cy: 360.0

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.fps: 30.0
Camera.RGB: 1

Camera.width: 1280
Camera.height: 720

# ORB extractor settings. Lower FAST thresholds can help custom phone/video frames.
ORBextractor.nFeatures: 2500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 10
ORBextractor.minThFAST: 5

Viewer.KeyFrameSize: 0.1
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 1
Viewer.PointSize: 2
Viewer.CameraSize: 0.15
Viewer.CameraLineWidth: 2
Viewer.ViewpointX: 0
Viewer.ViewpointY: -10
Viewer.ViewpointZ: -0.1
Viewer.ViewpointF: 2000
